    <!-- SEO & AEO Primary Metadata -->
    <title>Contact & Location | Aroma & Crust Artisan Cafe</title>
    <meta name="description" content="Contact Aroma & Crust Cafe. Find our address, phone number, opening hours, delivery area, and table booking form.">
    <meta name="keywords" content="contact Aroma and Crust Cafe, cafe address, pizza delivery phone, order takeout, local cafe hours">
    <meta name="author" content="Aroma & Crust Artisan Cafe">
    <link rel="canonical" href="https://aromacrustcafe.com/contact.html">

    <!-- Schema.org LocalBusiness Structured Data for Local AEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "mainEntity": {
        "@type": "Restaurant",
        "name": "Aroma & Crust Artisan Cafe",
        "telephone": "+1-555-276-6223",
        "email": "contact@aromacrustcafe.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "452 Artisan Boulevard, Suite 100",
          "addressLocality": "New York",
          "addressRegion": "NY",
          "postalCode": "10001",
          "addressCountry": "US"
        },
        "openingHours": "Mo-Su 10:00-23:00"
      }
    }
    </script>

    <!-- CSS LINK -->
    <link rel="stylesheet" href="style.css">
    <!-- Fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body>

    <!-------------------------------------------- HEADER SECTION -->
    <header class="header">
        <a href="./index.html" class="logo">
            <img src="./image/pngegg.png" alt="Aroma and Crust Cafe Logo">
        </a>
        <nav class="navbar">
            <a href="./index.html">home</a>
            <a href="./about.html">about</a>
            <a href="./menu.html">menu</a>
            <a href="./products.html">products</a>
            <a href="./review.html">review</a>
            <a href="./faq.html">faq</a>
            <a href="./contact.html" class="active">contact</a>
            <a href="./blog.html">blog</a>
        </nav>
        <div class="buttons">
            <button id="search-btn" aria-label="Search">
                <i class="fas fa-search"></i>
            </button>
            <button id="cart-btn" aria-label="Cart">
                <i class="fas fa-shopping-cart"></i>
            </button>
            <button id="menu-btn" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <div class="search-form">
            <input type="text" class="search-input" id="search-box" placeholder="Search...">
            <i class="fas fa-search"></i>
        </div>
        <div class="cart-items-container">
            <div class="cart-item">
                <i class="fas fa-times"></i>
                <img src="./image/pngwing.com (1).png" alt="Mixed Pizza">
                <div class="content">
                    <h3>Artisan Mixed Pizza</h3>
                    <div class="price">$15.99</div>
                </div>
            </div>
            <div class="cart-item">
                <i class="fas fa-times"></i>
                <img src="./image/pngwing.com (2).png" alt="Prime Brioche Burger">
                <div class="content">
                    <h3>Prime Angus Burger</h3>
                    <div class="price">$16.99</div>
                </div>
            </div>
            <a href="./contact.html" class="btn">check out</a>
        </div>
    </header>
    <!-- -------------------------------------------HEADER SECTION -->

    <!-- -------------------------------------------CONTACT SECTION -->
    <section class="contact" id="contact">
        <h1 class="heading">contact <span>us</span></h1>
        <div class="row">
            <iframe class="map" title="Aroma and Crust Cafe Google Map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d983.3235940970079!2d8.540719273659763!3d47.3713194174677!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47900a00aa1e1d17%3A0x278f576acdd580f5!2sStorchen%20Z%C3%BCrich%20-%20Lifestyle%20Boutique%20Hotel!5e0!3m2!1sde!2sch!4v1658505945506!5m2!1sde!2sch" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            <form action="#">
                <h3>get in touch</h3>
                <div class="inputBox">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="inputBox">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="Your Email Address" required>
                </div>
                <div class="inputBox">
                    <i class="fas fa-phone"></i>
                    <input type="tel" placeholder="Your Phone Number" required>
                </div>
                <input type="submit" class="btn" value="send message">
            </form>
        </div>
    </section>
    <!-- -------------------------------------------CONTACT SECTION -->

    <!-- -------------------------------------------FOOTER SECTION -->
    <footer class="footer">
        <div class="search">
            <input type="text" class="search-input" placeholder="Search...">
